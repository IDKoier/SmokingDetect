<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監控紀錄</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="realtime.html">實時監控</a></li>
                <li><a href="records.html">監控紀錄</a></li>
                <li><a href="settings.html">系統設定</a></li>
                <li><a href="login.html">管理員登入</a></li>
                </ul>
        </nav>
    </header>
    
    <aside>
        <h2>查詢選項</h2>
        <form>
            <ul>
                <li>
                     <div id="time-toggle">依時間查詢：</div>
                     <ul id="time-options" class="hidden-options">
                        <li><div id="1-hour">近一小時</div></li>
                        <li><div id="6-hour">近六小時</div></li>
                        <li><div id="1-day">近一天</div></li>
                        <li><div id="1-week">近一星期</div></li>
                        <li><div id="1-month">近一個月</div></li>
                        <li><div id="all">總覽</div></li>
                    </ul>
                </li>
                <li>
                   <div id="location-toggle">依地點查詢：</div>
                    <ul id="location-options" class="hidden-options">
                        </ul>
                </li>
            </ul>
        </form>
    </aside>

    <main>
        <div class="note-container" id="note-container">
            <p style="color: white; padding: 20px;">載入中...</p>
        </div>
        
        <div id="pagination-controls" style="display: flex; justify-content: center; gap: 20px; margin-top: 20px; padding-bottom: 20px;">
            <button id="prev-page" style="padding: 5px 15px; cursor: pointer; display: none;">上一頁</button>
            <span id="page-indicator" style="color: white; line-height: 30px;"></span>
            <button id="next-page" style="padding: 5px 15px; cursor: pointer; display: none;">下一頁</button>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 系統狀態變數
            let currentPage = 1;
            let currentDevice = null;
            let currentTimeRange = "all";
            let knownLocations = new Set(); // 用於記錄已出現過的地點

            // 1. 綁定時間篩選器的點擊事件
            const timeMap = {
                "近一小時": "aHour",
                "近六小時": "sixHour",
                "近一天": "aDay",
                "近一星期": "aWeek",
                "近一個月": "aMonth",
                "總覽": "all"
            };

            const timeOptions = document.querySelectorAll('#time-options div');
            timeOptions.forEach(function (option) {
                option.addEventListener('click', function () {
                    currentTimeRange = timeMap[this.textContent] || "all";
                    currentPage = 1; // 切換條件時回到第一頁
                    fetchRecords();
                });
            });

            // 2. 綁定分頁按鈕事件
            document.getElementById('prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchRecords();
                }
            });
            document.getElementById('next-page').addEventListener('click', () => {
                currentPage++;
                fetchRecords();
            });

            // 3. 核心抓取資料函數
            function fetchRecords() {
                const container = document.getElementById('note-container');
                container.innerHTML = '<p style="color: white; padding: 20px;">資料載入中...</p>';

                // 組合 URL 與參數
                let url = `/api/search_device?page=${currentPage}`;
                if (currentDevice && currentDevice !== "總覽") {
                    url += `&device_name=${encodeURIComponent(currentDevice)}`;
                }
                if (currentTimeRange && currentTimeRange !== "all") {
                    url += `&time=${currentTimeRange}`;
                }

                // 發送請求
                fetch(url, { method: 'GET' })
                .then(response => {
                    if (response.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    return response.json();
                })
                .then(res => {
                    if (res && res.success) {
                        renderNotes(res.data);
                        updatePaginationUI(res.data.length);
                        updateLocationOptions(res.data);
                    } else {
                        container.innerHTML = `<p style="color: red; padding: 20px;">載入失敗: ${res ? res.message : "未知錯誤"}</p>`;
                    }
                })
                .catch(err => {
                    console.error("API 錯誤：", err);
                    container.innerHTML = '<p style="color: red; padding: 20px;">網路請求發生錯誤，請檢查主機狀態。</p>';
                });
            }

            function renderNotes(data) {
                const container = document.getElementById('note-container');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p style="color: white; padding: 20px;">目前沒有符合條件的紀錄。</p>';
                    return;
                }

                data.forEach((item) => {
                    // 解析時間格式 "YYYY-MM-DD HH:MM:SS"
                    const timeParts = item.recognition_time.split(" ");
                    const dateStr = timeParts[0] || "Unknown";
                    const timeStr = timeParts[1] || "Unknown";

                    const noteDiv = document.createElement('div');
                    noteDiv.className = 'note';
                    
                    // 完全套用原本的 HTML 結構，透過呼叫 /images/ 端口載入 GIF
                    noteDiv.innerHTML = `
                        <img src="/images/${item.hash_filename}.gif" alt="Smoke Image">
                        <div class="descriptions">
                            <p class="description">地點：${item.device_name}</p>
                            <p class="description">日期：${dateStr}</p>
                            <p class="description">時間：${timeStr}</p>
                        </div>
                    `;
                    container.appendChild(noteDiv);
                });
            }

            // 5. 動態生成地點選單 (仿造原先的邏輯)
            function updateLocationOptions(data) {
                const locationOptions = document.getElementById('location-options');
                
                data.forEach(item => {
                    if (!knownLocations.has(item.device_name)) {
                        knownLocations.add(item.device_name);
                        
                        const li = document.createElement('li');
                        const div = document.createElement('div');
                        div.textContent = item.device_name;
                        div.style.cursor = "pointer"; // 加入鼠標樣式
                        
                        // 綁定點擊事件
                        div.addEventListener('click', function() {
                            currentDevice = this.textContent;
                            currentPage = 1;
                            fetchRecords();
                        });
                        
                        li.appendChild(div);
                        // 將新地點插入在「總覽」按鈕之前（如果總覽按鈕存在的話）
                        locationOptions.insertBefore(li, locationOptions.lastElementChild || null);
                    }
                });

                // 確保「總覽」選項永遠存在並置於最下方
                if (!document.getElementById('loc-all-btn')) {
                    const liAll = document.createElement('li');
                    const divAll = document.createElement('div');
                    divAll.id = 'loc-all-btn';
                    divAll.textContent = '總覽';
                    divAll.style.cursor = "pointer";
                    divAll.addEventListener('click', function() {
                        currentDevice = null;
                        currentPage = 1;
                        fetchRecords();
                    });
                    liAll.appendChild(divAll);
                    locationOptions.appendChild(liAll);
                }
            }

            // 6. 更新分頁按鈕顯示狀態
            function updatePaginationUI(dataLength) {
                const prevBtn = document.getElementById('prev-page');
                const nextBtn = document.getElementById('next-page');
                const indicator = document.getElementById('page-indicator');

                indicator.textContent = `第 ${currentPage} 頁`;
                prevBtn.style.display = currentPage > 1 ? 'inline-block' : 'none';
                
                // 如果回傳的資料小於 50 筆，代表已經是最後一頁，隱藏下一頁按鈕
                nextBtn.style.display = dataLength === 50 ? 'inline-block' : 'none';
            }

            // 初次載入時自動執行一次資料抓取
            fetchRecords();
        });
    </script>
</body>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
