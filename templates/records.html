<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>監控紀錄</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="realtime.html">實時監控</a></li>
                <li><a href="records.html">監控紀錄</a></li>
                <li><a href="settings.html">系統設定</a></li>
                <li><a href="login.html">管理員登入</a></li>
                </ul>
        </nav>
    </header>
    <div class="content-wrapper"> 
    <aside>
        <h2>查詢選項</h2>
        <form>
            <ul>
                <li>
                     <div id="time-toggle">依時間查詢：</div>
                     <ul id="time-options" class="hidden-options">
                        <li><div id="1-hour">近一小時</div></li>
                        <li><div id="6-hour">近六小時</div></li>
                        <li><div id="1-day">近一天</div></li>
                        <li><div id="1-week">近一星期</div></li>
                        <li><div id="1-month">近一個月</div></li>
                        <li><div id="all">總覽</div></li>
                    </ul>
                </li>
                <li>
                   <div id="location-toggle">依地點查詢：</div>
                    <ul id="location-options" class="hidden-options">
        {% for device in devices %}
        <li><div class="loc-option" style="cursor: pointer;">{{ device }}</div></li>
        {% endfor %}
        <li><div class="loc-option" id="loc-all-btn" style="cursor: pointer;">總覽</div></li>
    </ul>
                </li>
            </ul>
        </form>
    </aside>

    <main>
    <div class="note-container" id="note-container">
        <p style="color: white; padding: 20px;">載入中...</p>
    </div>
    
    <div id="pagination-controls">
        <button id="prev-page">上一頁</button>
        <span id="page-indicator"></span>
        <button id="next-page">下一頁</button>
    </div>
</main>
</div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            let currentPage = 1;
            let currentDevice = null;
            let currentTimeRange = "all";
            let knownLocations = new Set(); 

            const timeMap = {
                "近一小時": "aHour",
                "近六小時": "sixHour",
                "近一天": "aDay",
                "近一星期": "aWeek",
                "近一個月": "aMonth",
                "總覽": "all"
            };

const locOptions = document.querySelectorAll('.loc-option');
locOptions.forEach(function (option) {
    option.addEventListener('click', function () {
        const selectedText = this.textContent;

        currentDevice = (selectedText === '總覽') ? null : selectedText;
        currentPage = 1;
        fetchRecords();
    });
});


            const timeOptions = document.querySelectorAll('#time-options div');
            timeOptions.forEach(function (option) {
                option.addEventListener('click', function () {
                    currentTimeRange = timeMap[this.textContent] || "all";
                    currentPage = 1; 
                    fetchRecords();
                });
            });


            document.getElementById('prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchRecords();
                }
            });
            document.getElementById('next-page').addEventListener('click', () => {
                currentPage++;
                fetchRecords();
            });


            function fetchRecords() {
                const container = document.getElementById('note-container');
                container.innerHTML = '<p style="color: black; padding: 20px; font-size: 1.2rem;">資料載入中...</p>';


                let url = `/api/search_device?page=${currentPage}`;
                if (currentDevice && currentDevice !== "總覽") {
                    url += `&device_name=${encodeURIComponent(currentDevice)}`;
                }
                if (currentTimeRange && currentTimeRange !== "all") {
                    url += `&time=${currentTimeRange}`;
                }


                fetch(url, { method: 'GET' })
                .then(response => {
                    if (response.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    return response.json();
                })
                .then(res => {
                    if (res && res.success) {
                        renderNotes(res.data);
                        updatePaginationUI(res.data.length);
                    } else {
                        container.innerHTML = `<p style="color: red; padding: 20px;">載入失敗: ${res ? res.message : "未知錯誤"}</p>`;
                    }
                })
                .catch(err => {
                    console.error("API 錯誤：", err);
                    container.innerHTML = '<p style="color: red; padding: 20px;">網路請求發生錯誤，請檢查主機狀態。</p>';
                });
            }

            function renderNotes(data) {
                const container = document.getElementById('note-container');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p style="color: black; padding: 20px;font-size: 1.2rem;">目前沒有符合條件的紀錄。</p>';
                    return;
                }

                data.forEach((item) => {

                    const timeParts = item.recognition_time.split(" ");
                    const dateStr = timeParts[0] || "Unknown";
                    const timeStr = timeParts[1] || "Unknown";

                    const noteDiv = document.createElement('div');
                    noteDiv.className = 'note';
                    

                    noteDiv.innerHTML = `
                        <img src="/images/${item.hash_filename}.gif" alt="Smoke Image">
                        <div class="descriptions">
                            <p class="description">地點：${item.device_name}</p>
                            <p class="description">日期：${dateStr}</p>
                            <p class="description">時間：${timeStr}</p>
                        </div>
                    `;
                    container.appendChild(noteDiv);
                });
            }


            function updatePaginationUI(dataLength) {
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const indicator = document.getElementById('page-indicator');

    indicator.textContent = `第 ${currentPage} 頁`;
    prevBtn.style.display = currentPage > 1 ? 'inline-block' : 'none';
    nextBtn.style.display = dataLength >= 5 ? 'inline-block' : 'none';
}
fetchRecords();
});
    </script>
	<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
